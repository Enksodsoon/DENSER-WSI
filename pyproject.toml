[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "denser-wsi"
version = "0.3.0"
description = "Falsification-first research framework for evidence-sensitive WSI compression"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "jsonschema==4.26.0",
  "numpy==2.5.1",
  "openslide-python==1.4.6",
  "Pillow==12.3.0",
  "typer==0.27.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.hatch.build.targets.wheel]
packages = ["src/denser"]
